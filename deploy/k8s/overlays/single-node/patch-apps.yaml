apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: anonyma
spec:
  replicas: 2
  template:
    spec:
      imagePullSecrets:
        - name: anonyma-registry
      containers:
        - name: gateway
          imagePullPolicy: IfNotPresent
          env:
            - name: RABBITMQ_TLS_DIR
              value: /certs/rmq
          volumeMounts:
            - name: rmq-certs
              mountPath: /certs/rmq
              readOnly: true
          readinessProbe:
            httpGet: { path: /readyz, port: 3000 }
            initialDelaySeconds: 40
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        # The client certificate only: the CA and server keys stay on the host.
        - name: rmq-certs
          secret:
            secretName: anonyma-rmq-client
            defaultMode: 0440
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core
  namespace: anonyma
spec:
  # Single replica on small-RAM hosts; scale to 2 when memory allows.
  replicas: 1
  template:
    spec:
      imagePullSecrets:
        - name: anonyma-registry
      containers:
        - name: core
          imagePullPolicy: IfNotPresent
          env:
            - name: RABBITMQ_TLS_DIR
              value: /certs/rmq
          volumeMounts:
            - name: rmq-certs
              mountPath: /certs/rmq
              readOnly: true
          readinessProbe:
            httpGet: { path: /readyz, port: 3001 }
            initialDelaySeconds: 40
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 3001 }
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 160Mi
      volumes:
        # The client certificate only: the CA and server keys stay on the host.
        - name: rmq-certs
          secret:
            secretName: anonyma-rmq-client
            defaultMode: 0440
---
