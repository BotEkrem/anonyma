apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: anonyma
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: anonyma
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: anonyma
        orgId: 1
        folder: Anonyma
        type: file
        disableDeletion: true
        updateIntervalSeconds: 30
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards
---
