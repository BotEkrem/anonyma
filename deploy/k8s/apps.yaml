                  name: anonyma-secrets
                  key: REDIS_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: anonyma-secrets
                  key: RABBITMQ_URL
            - name: REALTIME_PORT
              value: "3003"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
