apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: anonyma
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      # App pods never call the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: anonyma/gateway:0.1.0
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: anonyma-config
            - secretRef:
                name: anonyma-gateway-secrets
          # Only the keys this service reads (not every password in anonyma-secrets).
          env:
            - name: INTERNAL_RPC_SECRET
              valueFrom:
                secretKeyRef:
                  name: anonyma-secrets
                  key: INTERNAL_RPC_SECRET
            - name: WS_TICKET_SECRET
              valueFrom:
                secretKeyRef:
                  name: anonyma-secrets
                  key: WS_TICKET_SECRET
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: anonyma-secrets
                  key: REDIS_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: anonyma-secrets
                  key: RABBITMQ_URL
            - name: GATEWAY_PORT
              value: "3000"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: anonyma
spec:
  selector:
    app: gateway
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core
  namespace: anonyma
spec:
  replicas: 2
  selector:
    matchLabels:
      app: core
  template:
    metadata:
      labels:
        app: core
    spec:
      # App pods never call the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: core
          image: anonyma/core:0.1.0
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: anonyma-config
          # Only the keys this service reads (not every password in anonyma-secrets).
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: anonyma-secrets
                  key: DATABASE_URL
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: anonyma-secrets
                  key: MONGO_URI
            - name: MESSAGE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: anonyma-secrets
                  key: MESSAGE_ENCRYPTION_KEY
            - name: MESSAGE_ENCRYPTION_KEY_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: anonyma-secrets
                  key: MESSAGE_ENCRYPTION_KEY_PREVIOUS
                  optional: true
            - name: INTERNAL_RPC_SECRET
              valueFrom:
                secretKeyRef:
                  name: anonyma-secrets
                  key: INTERNAL_RPC_SECRET
            - name: WS_TICKET_SECRET
              valueFrom:
                secretKeyRef:
                  name: anonyma-secrets
                  key: WS_TICKET_SECRET
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: anonyma-secrets
                  key: REDIS_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: anonyma-secrets
                  key: RABBITMQ_URL
            - name: CORE_PORT
              value: "3001"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3001
            initialDelaySeconds: 8
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: core
  namespace: anonyma
spec:
  selector:
    app: core
  ports:
    - port: 3001
      targetPort: 3001
---
