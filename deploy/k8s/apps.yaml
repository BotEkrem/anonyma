        app: realtime
    spec:
      # App pods never call the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: realtime
          image: anonyma/realtime:0.1.0
          ports:
            - containerPort: 3003
          envFrom:
            - configMapRef:
