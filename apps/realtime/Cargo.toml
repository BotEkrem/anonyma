[package]
name = "anonyma-realtime"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
aes-gcm = "0.10"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
futures-util = "0.3"
hmac = "0.12"
lapin = "2"
# Already in the tree through lapin's TLS stack; used directly to hand it the
# client certificate (src/bus/tls.rs). PEM parsing is rustls-pki-types' own
# (rustls-pemfile is unmaintained).
p12-keystore = "0.1"
rustls-pki-types = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
redis = { version = "0.29", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
dashmap = "6"
hex = "0.4"
metrics = "0.24"
# Only the recorder is used (/metrics is served by axum). The default features
# (push-gateway, http-listener) pulled in hyper-rustls with aws-lc-rs next to
# lapin's ring, and rustls then panicked choosing a provider for RabbitMQ TLS.
metrics-exporter-prometheus = { version = "0.16", default-features = false }
once_cell = "1"
